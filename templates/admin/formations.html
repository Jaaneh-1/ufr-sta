{% extends "base.html" %}
{% block title %}Admin Formations — UFR STA{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
      <h2 class="section-title" style="margin-bottom:0;">Gestion des Formations</h2>
      <a href="{{ url_for('admin') }}" class="btn btn-outline" style="border-color:#8B3A2A; color:#8B3A2A;">← Retour</a>
    </div>
    <div class="admin-form-card">
      <h3 class="admin-form-titre">Ajouter une formation</h3>
      <form action="{{ url_for('ajouter_formation') }}" method="POST">
        <div class="form-group">
          <label class="form-label">Nom</label>
          <input type="text" name="nom" class="form-input" placeholder="Nom de la formation" required>
        </div>
        <div class="form-group">
          <label class="form-label">Niveau</label>
          <select name="niveau" class="form-input" required>
            <option value="">Choisir un niveau</option>
            <option value="Licence">Licence</option>
            <option value="Master">Master</option>
            <option value="Doctorat">Doctorat</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Durée</label>
          <input type="text" name="duree" class="form-input" placeholder="Ex: 3 ans" required>
        </div>
        <div class="form-group">
          <label class="form-label">Département</label>
          <select name="departement" class="form-input" required>
            <option value="">Choisir un département</option>
            <option value="MIM">MIM</option>
            <option value="SMU">SMU</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-input form-textarea" placeholder="Description" required></textarea>
        </div>
        <button type="submit" class="btn btn-primaire">Ajouter</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
