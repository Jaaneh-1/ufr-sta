{% extends "base.html" %}
{% block title %}Admin Galerie — UFR STA{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
      <h2 class="section-title" style="margin-bottom:0;">Gestion de la Galerie</h2>
      <a href="{{ url_for('admin') }}" class="btn btn-outline" style="border-color:#8B3A2A; color:#8B3A2A;">← Retour</a>
    </div>
    <div class="admin-form-card">
      <h3 class="admin-form-titre">Ajouter une photo</h3>
      <form action="{{ url_for('ajouter_photo') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group">
          <label class="form-label">Titre</label>
          <input type="text" name="titre" class="form-input" placeholder="Titre de la photo" required>
        </div>
        <div class="form-group">
          <label class="form-label">Album</label>
          <input type="text" name="album" class="form-input" placeholder="Ex: Journée scientifique 2026" required>
        </div>
        <div class="form-group">
          <label class="form-label">Photo</label>
          <input type="file" name="photo" class="form-input" accept="image/*" required>
        </div>
        <button type="submit" class="btn btn-primaire">Ajouter</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
